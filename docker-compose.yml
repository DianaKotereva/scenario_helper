name: scenario_helper
services:
  opensearch-node:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-node
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      opensearch-node:
        condition: service_healthy
    environment:
      - ES_URL=http://opensearch-node:9200
      - OPENSEARCH_HOSTS=["opensearch-node:9200"]
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./logs/streamlit:/app/logs/streamlit
      - .:/app
    ports:
      - "8501:8501"

  hyperextract:
    build:
      context: .
      dockerfile: docker/hyperextract.Dockerfile
    container_name: hyperextract-worker
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=https://api.deepseek.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_API_KEY=${OPENAI_EMBEDDING_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.proxyapi.ru/openai/v1}
      - OPENAI_BASE_URL=${OPENAI_API_BASE:-https://api.proxyapi.ru/openai/v1}
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./.he:/root/.he
      - .:/workspace/scenatio_helper
      - ../Hyper-Extract:/workspace/Hyper-Extract
      - ./data:/workspace/data
      - ./test_data:/workspace/test_data
      - ./tools:/workspace/tools
